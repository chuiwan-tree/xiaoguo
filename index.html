<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笑过</title>
<style>
  body { background: #f2efe6; color: #2b2b2b; font: 15px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; margin: 0; padding: 18px; }
  #wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .intro { color: #555; margin: 0 0 14px; }
  #out { font: 14px/1.6 "SF Mono", Menlo, "PingFang SC", monospace; white-space: pre-wrap; background: #fbfaf5; border: 1px solid #ddd8c8; border-radius: 6px; padding: 12px 14px; height: 52vh; overflow-y: auto; }
  #out .cmd { color: #8a5a20; }
  #out .old { color: #8b8b8b; }
  .row { margin: 8px 0 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row .lab { color: #777; font-size: 13px; width: 3.5em; }
  button { font: inherit; padding: 3px 11px; border: 1px solid #999; background: #fff; border-radius: 4px; cursor: pointer; }
  button.big { padding: 4px 18px; }
  .hint { color: #777; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>笑过</h1>
  <p class="intro">一个小文字游戏。一局八年，十来分钟。<br>点“过”看下一回；一年里可以点一个字，就是对她说一句“××别笑”，或者点“笑吧”。</p>
  <div id="out"></div>
  <div class="row"><span class="lab">说</span><span id="r0"></span></div>
  <div class="row"><span class="lab"></span><span id="r1"></span></div>
  <div class="row"><span class="lab"></span><span id="r2"></span></div>
  <div class="row"><span class="lab"></span><button id="calm">笑吧</button> <button id="next" class="big">过</button></div>
  <p class="hint"><button id="again">再开一局</button>　从《聊斋·婴宁》来。</p>
</div>
<script src="笑.js"></script>
<script>
var out = document.getElementById('out');
var game = null;
function show(text, cmd) {
  out.querySelectorAll('.cur').forEach(function (e) { e.classList.remove('cur'); e.classList.add('old'); });
  if (cmd) { var c = document.createElement('div'); c.className = 'cmd'; c.textContent = '> ' + cmd; out.appendChild(c); }
  var d = document.createElement('div'); d.className = 'cur'; d.textContent = text + '\n\n'; out.appendChild(d);
  var first = cmd ? d.previousSibling : d;
  out.scrollTop = first.offsetTop - out.offsetTop - 4;
}
function start() {
  out.innerHTML = '';
  var q = location.search.match(/seed=(\d+)/);
  game = newGame(q ? parseInt(q[1], 10) : Math.floor(Math.random() * 100000));
  show(openingText(game));
}
function doit(cmd) {
  var label = cmd;
  if (cmd !== '过' && cmd !== '笑吧') label = '说 ' + cmd;
  show(act(game, cmd), label);
}
[[0, 0, 5], [1, 5, 10], [2, 10, 15]].forEach(function (g) {
  var box = document.getElementById('r' + g[0]);
  ALL.slice(g[1], g[2]).forEach(function (w) {
    var b = document.createElement('button'); b.textContent = w;
    b.onclick = function () { doit(w); };
    box.appendChild(b); box.appendChild(document.createTextNode(' '));
  });
});
document.getElementById('calm').onclick = function () { doit('笑吧'); };
document.getElementById('next').onclick = function () { doit('过'); };
document.getElementById('again').onclick = start;
document.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body) { e.preventDefault(); doit('过'); } });
start();
</script>
</body>
</html>
